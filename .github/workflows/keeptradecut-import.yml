name: KeepTradeCut Import

on:
  schedule:
    # Every day at 8am UTC (offset from FantasyCalc at 7am)
    - cron: "0 8 * * *"
  workflow_dispatch: # allow manual triggers from GitHub UI

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: fantasy-trade-calculator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run KeepTradeCut import
        run: npm run import:keeptradecut
