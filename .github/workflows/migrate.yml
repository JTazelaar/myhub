name: Prisma Migrate

on:
  push:
    branches: [infra-phase1]
    paths:
      - "fantasy-trade-calculator/prisma/migrations/**"
      - "fantasy-trade-calculator/prisma/schema.prisma"
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: fantasy-trade-calculator

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Baseline existing schema (no-op if already done)
        run: npx prisma migrate resolve --applied "20260101000000_baseline" || true

      - name: Apply pending migrations
        run: npx prisma migrate deploy
